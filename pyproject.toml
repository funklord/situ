# situc has no runtime dependencies and is not packaged yet, so this file
# carries tool configuration only. Adding a dependency requires a decision
# record (project.md section 22).

[tool.pytest.ini_options]
# `test`, not `tests`. It was `tests` and no such directory has ever existed
# here, so bare `pytest` warned "No files were found in testpaths" and
# searched recursively from the working directory instead -- which reaches
# `build/` and the caches. `make test` passes explicit paths and never saw
# it. The same wrong pair of names, `tools` and `tests`, has now been found
# in four places; `python_floor`'s docstring records the Makefile's.
testpaths       = ["test"]
pythonpath      = ["."]
filterwarnings  = ["error"]

[tool.mypy]
python_version         = "3.11"
strict                 = true
# Stated rather than inherited. `bytearray` is not a `bytes`, and mypy
# promoted one to the other for years before stopping; `strict` implies this
# in a new enough mypy and did not in 1.15, so the same tree passed here and
# failed on CI, which installs the latest. Naming it makes the two agree and
# makes the position the project's rather than a property of whichever mypy
# is on the machine.
strict_bytes           = true
warn_unreachable       = true
disallow_any_unimported = true
show_error_codes       = true
pretty                 = true

# The two files in `tool/` that are VERBATIM COPIES spread from
# `~/.claude/tool/`, differing from the source only by a two-line header
# saying so. `harmonization.md` requires a copy not to diverge, so situ
# cannot annotate them -- and typechecking a file you may not edit is a gate
# you cannot pass.
#
# They stay in the checked SET rather than being dropped from it, because
# `test/unit/test_conventions.py` imports `style_gate` and mypy has to
# resolve it: excluding the directory turns 151 errors into two
# unresolved-import ones, which is the same gate red for a worse reason.
#
# The annotations themselves are the shared tool's business and are recorded
# as a signal to `claude-guidelines` rather than fixed here (26.311).
[[tool.mypy.overrides]]
module = ["style_gate", "test_style_gate",
          "tool.style_gate", "tool.test_style_gate"]
ignore_errors = true
