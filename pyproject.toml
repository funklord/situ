# situc has no runtime dependencies and is not packaged yet, so this file
# carries tool configuration only. Adding a dependency requires a decision
# record (project.md section 22).

[tool.pytest.ini_options]
# `test`, not `tests`. It was `tests` and no such directory has ever existed
# here, so bare `pytest` warned "No files were found in testpaths" and
# searched recursively from the working directory instead -- which reaches
# `build/` and the caches. `make test` passes explicit paths and never saw
# it. The same wrong pair of names, `tools` and `tests`, has now been found
# in four places; `python_floor`'s docstring records the Makefile's.
testpaths       = ["test"]
pythonpath      = ["."]
filterwarnings  = ["error"]
# Keep a run's temporary tree only where something failed, which is the one
# case anybody wants to look at it. The default keeps the last THREE runs,
# and prunes at the START of a run -- so a run that is interrupted is never
# retired on schedule while the numbering advances anyway.
#
# Measured here rather than assumed: a full `make check` leaves 2.4 GiB of
# generated code and compiled binaries per schema per backend, so the
# default holds about 7 GiB of working set on a filesystem with 22 GiB
# free. It was cleared by hand three times -- 8.5, 4.7 and 4.7 GiB -- and
# the count was the policy working correctly each time. The size is what
# makes it matter, which is why the fix is the policy and not a sweep.
#
# Needs pytest 7.3 or newer for the option to exist at all; this tree is on
# 8.3.5 and `python_floor` holds the language version separately.
tmp_path_retention_policy = "failed"

[tool.mypy]
python_version         = "3.11"
strict                 = true
# Stated rather than inherited. `bytearray` is not a `bytes`, and mypy
# promoted one to the other for years before stopping; `strict` implies this
# in a new enough mypy and did not in 1.15, so the same tree passed here and
# failed on CI, which installs the latest. Naming it makes the two agree and
# makes the position the project's rather than a property of whichever mypy
# is on the machine.
strict_bytes           = true
warn_unreachable       = true
disallow_any_unimported = true
show_error_codes       = true
pretty                 = true
