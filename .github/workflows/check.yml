# What `make check` checks, on a machine nobody configured by hand.
#
# The point of running it here is not that it runs. Everything this suite
# drives a toolchain for *skips* when the toolchain is absent -- gcc, g++,
# rustc, lua, doxygen, the aarch64 cross compiler and qemu -- so a runner with
# none of them installed reports a green tick over a fraction of the tests.
# That is this repository's recurring finding wearing a CI badge, and it is
# why the install step below is long and why the skip count is asserted rather
# than printed.
#
# Python is 3.11 because 3.11 is the floor the project declares, and a floor
# nothing runs at is a claim rather than a fact: `situc` claimed 3.11 for six
# phases while a PEP 701 f-string made it 3.12, and the machine that found it
# was the one that did not have 3.13.

name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v5 is where checkout moved to Node 24, which is the deprecation the
      # runner annotates; v7 is the current major and the two steps between
      # are a credential-handling change this workflow does not reach (it
      # never uses the token after checkout) and a refusal to check out a
      # fork PR under `pull_request_target` or `workflow_run`, neither of
      # which is a trigger here. Taking the current major rather than the
      # minimum that clears the warning, because the minimum is a version
      # that will be annotated again.
      - uses: actions/checkout@v7

      # Named one per line with a reason, because a toolchain that quietly
      # falls out of this list takes a group of tests with it and says so
      # only in a skip count nobody reads.
      - name: Install the toolchains the suite would otherwise skip
        run: |
          sudo apt-get update
          # `tshark` asks debconf whether non-superusers may capture, and an
          # unanswered question is an install that hangs rather than one that
          # fails. Answered here rather than left to `noninteractive`, which
          # would take the default silently -- and the answer is no, because
          # nothing here captures anything: the oracle reads a file.
          echo 'wireshark-common wireshark-common/install-setuid boolean false' \
            | sudo debconf-set-selections
          # `--no-install-recommends` keeps the image small and costs two
          # packages that have to be named: the cross libc headers, without
          # which `aarch64-linux-gnu-gcc` cannot find `bits/libc-header-
          # start.h`, and ImageMagick, whose `convert` writes the BMP the
          # differential oracle reads back.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            gcc g++ \
            rustc \
            lua5.4 \
            doxygen \
            cmake \
            libcmocka-dev \
            gcc-aarch64-linux-gnu \
            protobuf-compiler \
            libc6-dev-arm64-cross \
            qemu-user \
            imagemagick \
            tshark

      # v6 is Node 24 here and v7 is an ESM and dependency refresh. Same
      # reasoning as above.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # `pymodbus` is pinned to the 3.8 series: 3.9 renamed
      # `FramerSocket.processIncomingFrame`, and an oracle is only an oracle
      # while it is the implementation the schema was checked against. A
      # floating version turns "situ disagrees with pymodbus" into "pymodbus
      # changed", which is the one thing a differential check must not say.
      #
      # `paho-mqtt` is pinned to the 2 series for that reason and one more.
      # The floor is real -- `mqtt.CallbackAPIVersion` arrived in 2.0 and the
      # oracle names it -- and the ceiling is the sharper half: the oracle
      # lays its packets out through `_send_connect`, `_send_publish`,
      # `_send_subscribe`, `_send_pingreq` and `_send_disconnect`, which are
      # private and carry no compatibility promise at all. That is the
      # pymodbus hazard with the guarantee removed, so it was the one package
      # here that should not have been floating. It was, until now.
      #
      # `pymodbus` and `paho-mqtt` are the differential oracles -- somebody
      # else's implementation of two protocols this tree describes -- and
      # they are not optional to `make check` even though the tests that use
      # them skip without them. `mypy --strict` with
      # `disallow_any_unimported` reads `test/unit/oracles.py` whether or
      # not those tests run, and an import it cannot resolve is an error. So
      # the typecheck depends on them, which was invisible until a machine
      # without them tried it: that is what the first CI run found.
      - run: |
          python -m pip install --disable-pip-version-check \
            pytest mypy 'pymodbus>=3.8,<3.9' 'paho-mqtt>=2,<3'

      - name: Report what is actually installed
        run: |
          gcc --version | head -1
          g++ --version | head -1
          rustc --version
          lua5.4 -v 2>&1 | head -1
          doxygen --version
          aarch64-linux-gnu-gcc --version | head -1
          qemu-aarch64 --version | head -1
          tshark --version | head -1
          python --version
          python -c 'import pymodbus, paho.mqtt; print("oracles present")'

      # `pipefail`, or `tee` would swallow a failing `make` and this would
      # be a workflow that reports success for a red build.
      - name: make check
        run: |
          set -o pipefail
          make check 2>&1 | tee /tmp/check.log

      # `make check` passing is not the same as `make check` having run over
      # everything. A skip is invisible in an exit status, and the guard that
      # this replaces compared the *count* against a ceiling -- 34 at the time
      # it was written, 45 as the limit. It earned its place on its first real
      # run: 50 skips against 34 locally, the whole difference being sixteen
      # differential-oracle tests that wanted `tshark`, quietly absent while
      # `make check` reported success.
      #
      # WHY THE COUNT WAS THE WRONG INSTRUMENT. It was 40 by the first green
      # run after the block lifted, five under the ceiling, and 38 of those 40
      # were properties of the *schemas* rather than of the machine: a schema
      # with no fixed-size struct has nothing for `--owned` to own, and there
      # are 37 schemas. So the number that trips this first is the one that
      # grows every time somebody adds an example -- a false red for routine
      # work -- while a toolchain vanishing and taking four tests with it
      # stays under the limit and passes. One ceiling over two populations
      # that move for different reasons fails for the wrong reason first and
      # is blind to the reason it exists.
      #
      # So classify instead of counting. Every skip reason that is a property
      # of the tree is named below with what it is; anything else is a skip
      # this machine caused, and one is enough to fail. Adding a line here is
      # the deliberate act the old ceiling asked for, and it costs a reason
      # rather than a number.
      #
      # `Qt6Core` is in the list and is the one machine-caused entry: the
      # install step deliberately does not carry Qt, which is heavy and buys
      # two tests. Naming it here is what keeps it a decision rather than
      # headroom being silently spent.
      #
      # Read from the log `make check` already wrote rather than running the
      # suite a second time: the first version of this took four minutes to
      # ask a question the first run had already answered.
      - name: Refuse a skip this machine caused
        run: |
          expected='has no fixed-size struct to own'          # --owned, per schema
          expected="$expected|no struct a driver can acquire" # --driver, per schema
          expected="$expected|got empty parameter set"        # a parametrize with no cases
          expected="$expected|predates the classifier"        # the C backend, by design
          expected="$expected|no draw validated"              # padded.situ needs vectors
          expected="$expected|where the interpreter is the check"  # we are ON the floor
          expected="$expected|Qt6Core"                        # not installed, deliberately

          total=$(sed -n 's/.*[^0-9]\([0-9]\+\) skipped.*/\1/p' \
                  /tmp/check.log | tail -1)
          total=${total:-0}
          lines=$(grep -c 'SKIPPED \[' /tmp/check.log || true)

          # A guard that reads nothing passes as loudly as one that reads
          # everything. `make check` runs pytest with `-rs`, so skips above
          # zero must come with a report; no report means this could not have
          # answered and must not say it did.
          if [ "$total" -gt 0 ] && [ "$lines" -eq 0 ]; then
            echo "check: $total skipped and no skip report in the log;" >&2
            echo "check: this guard read nothing. Is pytest still run -rs?" >&2
            exit 1
          fi

          accounted=$(awk -v pat="$expected" \
            '/SKIPPED \[/ && $0 ~ pat { c=$2; gsub(/[^0-9]/,"",c); n += c }
             END { print n+0 }' /tmp/check.log)
          unaccounted=$(( total - accounted ))
          echo "skipped: $total ($accounted accounted for, $unaccounted not)"

          if [ "$unaccounted" -gt 0 ]; then
            echo "check: $unaccounted skip(s) this machine caused:" >&2
            awk -v pat="$expected" '/SKIPPED \[/ && $0 !~ pat' \
              /tmp/check.log | sed 's/^/  /' >&2
            echo "check: install what they name, or add the reason above" >&2
            exit 1
          fi
