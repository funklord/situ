# situ, built without a build file.
#
# Two things need saying here, and both are because this tree's default
# deliverable is a library rather than a program. fmake discovers programs
# by finding main(); everything below is what that cannot see.

# The C runtime, which is what `make` builds and what every generated codec
# links against. runtime/c/situ.c has no main and nothing in this tree links
# it, so without this stanza fmake correctly concludes nothing reaches it and
# correctly does not build it -- `make`'s default target would have no
# equivalent at all. `kind = "static"` says the archive is the deliverable,
# and the name gives libsitu.a, which is what the Makefile calls it and what
# debian/libsitu-dev ships.
[target.situ]
kind    = "static"
sources = ["runtime/c/situ.c"]

# The embedded walker, `make walk-c`. fmake names a target after the
# directory its root TU sits in, and walker/c's is `c` -- accurate and
# useless, and it collides with nothing only by luck, runtime/c being the
# other directory of that name. situ-walk-c is what the Makefile emits and
# what section 0035 calls it.
[target.c]
name = "situ-walk-c"

# Nothing here configures the generated C suite, and none is needed: fmake
# understands .situ, runs situc for a schema when some source includes the
# header that schema would write, and builds eleven of the twelve test
# programs unaided. Named individually they pass.
#
# The twelfth is test_kernels, which wants situ_base16_decode and its
# neighbours. Those come from `situc gen-derived`, which writes
# kernels_derived.c -- a second artifact family over the same schema, where
# fmake understands `situc build`. One failing target stops `fmake test`
# before it runs the eleven that built, so `make test` and `make check` are
# still how the suite is run; the Makefile's double compilation, checked and
# released, is a build rather than a configuration either way.
# See README, "Building and testing".
