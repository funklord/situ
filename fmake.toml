# situ, built without a build file.
#
# Two things need saying here, and both are because this tree's default
# deliverable is a library rather than a program. fmake discovers programs
# by finding main(); everything below is what that cannot see.

# The C runtime, which is what `make` builds and what every generated codec
# links against. runtime/c/situ.c has no main and nothing in this tree links
# it, so without this stanza fmake correctly concludes nothing reaches it and
# correctly does not build it -- `make`'s default target would have no
# equivalent at all. `kind = "static"` says the archive is the deliverable,
# and the name gives libsitu.a, which is what the Makefile calls it and what
# debian/libsitu-dev ships.
[target.situ]
kind    = "static"
sources = ["runtime/c/situ.c"]

# The embedded walker, `make walk-c`. fmake names a target after the
# directory its root TU sits in, and walker/c's is `c` -- accurate and
# useless, and it collides with nothing only by luck, runtime/c being the
# other directory of that name. situ-walk-c is what the Makefile emits and
# what section 0035 calls it.
[target.c]
name = "situ-walk-c"

# The generated C suite needs one thing configured. fmake understands
# .situ: it runs situc for a schema when some source includes the header
# that schema would write, and it runs both of the commands whose output is
# the schema's own code -- `build` and `gen-derived`. What it cannot see is
# `situ_check.h`, which every test program includes since 5b49be91 and
# which test/generated/Makefile writes from situc/codegen/c/selfcheck.py;
# the stanza below is that rule, written beside the tests so their quoted
# include finds it with no -I (from fmake, situ inbox 20261123T2001Z).
# With it all twelve build and pass under `fmake test`.
#
# The Python suite and the Makefile's double compilation, checked and
# released, are not attempted and are not configuration. `make check` is
# still what has to pass before a commit.
# See README, "Building and testing".

[generate.situ_check]
command = "python3 -c 'import sys; from situc.codegen.c.selfcheck import header; sys.stdout.write(header())' > test/generated/situ_check.h"
inputs  = ["situc/codegen/c/selfcheck.py"]
outputs = ["test/generated/situ_check.h"]
