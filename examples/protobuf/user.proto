// The .proto this schema's situ description corresponds to.
//
// Kept beside the schema so the golden vectors can be regenerated by an
// independent implementation rather than by situ itself. That is the whole
// point of the conformance test: a description that agrees only with its own
// compiler has demonstrated nothing.
//
//   protoc --encode=User user.proto < case.txt > case.bin

syntax = "proto2";

message User {
	optional uint64 user_id  = 1;   // wire type 0, varint
	optional string username = 2;   // wire type 2, length-prefixed
	optional float  score    = 3;   // wire type 5, fixed 32-bit
}
